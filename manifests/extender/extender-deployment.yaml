apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbon-extender
  namespace: carbon-scheduler
  labels:
    app: carbon-extender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carbon-extender
  template:
    metadata:
      labels:
        app: carbon-extender
    spec:
      serviceAccountName: carbon-extender
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: extender
          image: ghcr.io/kevinauberson/k8s-carbon-aware-scheduler-extender/extender:sha-f2e7487a39699b110be16d4df166f1e60c70c0ec
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            # Temporal shifting — délai maximum pour les pods BATCH et BEST_EFFORT
            # Peut être surchargé par pod via l'annotation carbon-aware/max-delay-hours
            # Exemples : 24 (1 jour), 48 (2 jours), 168 (1 semaine)
            - name: DEFAULT_MAX_DELAY_HOURS
              value: "24"
            # Gain minimum (gCO2/kWh) pour qu'un délai soit justifié
            # Réduire à 5 pour des grids peu variables (ex: Suisse en été)
            - name: MIN_GAIN_TO_DELAY_G_PER_KWH
              value: "10"
            - name: IN_CLUSTER
              value: "true"
          volumeMounts:
            - name: carbon-signal
              mountPath: /etc/carbon-signal
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: carbon-signal
          configMap:
            name: carbon-signal
