apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-auto-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-auto-deployment
  template:
    metadata:
      labels:
        app: demo-auto-deployment
    spec:
      schedulerName: carbon-aware
      containers:
        - name: app
          image: busybox
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
# Job batch (flexible par défaut) : schedulingGate retient le pod tant que la CI
# n'est pas favorable. Le gate controller retire la gate automatiquement.
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-auto-job
  namespace: default
spec:
  template:
    spec:
      schedulerName: carbon-aware
      schedulingGates:
        - name: carbon-aware-gate
      containers:
        - name: app
          image: busybox
          command: ["sleep", "10"]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
      restartPolicy: Never
---
# Job batch opt-out : annotation flexible=false → le gate controller ne retarde
# jamais ce pod (la gate est retirée immédiatement)
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-auto-job-no-delay
  namespace: default
spec:
  template:
    metadata:
      annotations:
        carbon-aware/flexible: "false"
    spec:
      schedulerName: carbon-aware
      schedulingGates:
        - name: carbon-aware-gate
      containers:
        - name: app
          image: busybox
          command: ["sleep", "10"]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
      restartPolicy: Never
---
# Pod orphelin sans resources : BestEffort → flexible par défaut → gate retient
# le pod tant que la CI n'est pas favorable
apiVersion: v1
kind: Pod
metadata:
  name: demo-auto-pod-besteffort
  namespace: default
spec:
  schedulerName: carbon-aware
  schedulingGates:
    - name: carbon-aware-gate
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
---
# Pod orphelin avec resources : pas d'owner, QoS=Guaranteed → latency-sensitive → schedule immédiat
apiVersion: v1
kind: Pod
metadata:
  name: demo-auto-pod-latency
  namespace: default
spec:
  schedulerName: carbon-aware
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
