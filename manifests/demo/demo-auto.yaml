apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-auto-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-auto-deployment
  template:
    metadata:
      labels:
        app: demo-auto-deployment
    spec:
      schedulerName: carbon-aware
      containers:
        - name: app
          image: busybox
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
# Batch job (flexible by default): schedulingGate holds the pod until CI
# conditions are favorable. The gate controller removes the gate automatically.
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-auto-job
  namespace: default
spec:
  template:
    spec:
      schedulerName: carbon-aware
      schedulingGates:
        - name: carbon-aware-gate
      containers:
        - name: app
          image: busybox
          command: ["sleep", "10"]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
      restartPolicy: Never
---
# Batch job opt-out: annotation flexible=false -> the gate controller never
# delays this pod (the gate is removed immediately)
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-auto-job-no-delay
  namespace: default
spec:
  template:
    metadata:
      annotations:
        carbon-aware/flexible: "false"
    spec:
      schedulerName: carbon-aware
      schedulingGates:
        - name: carbon-aware-gate
      containers:
        - name: app
          image: busybox
          command: ["sleep", "10"]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
      restartPolicy: Never
---
# Orphan pod without resources: BestEffort -> flexible by default -> gate holds
# the pod until CI conditions are favorable
apiVersion: v1
kind: Pod
metadata:
  name: demo-auto-pod-besteffort
  namespace: default
spec:
  schedulerName: carbon-aware
  schedulingGates:
    - name: carbon-aware-gate
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
---
# Orphan pod with resources: no owner, QoS=Guaranteed -> latency-sensitive -> immediate schedule
apiVersion: v1
kind: Pod
metadata:
  name: demo-auto-pod-latency
  namespace: default
spec:
  schedulerName: carbon-aware
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
