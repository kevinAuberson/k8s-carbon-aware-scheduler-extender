# Helm values for Apache Airflow with KubernetesExecutor
# Install: helm install airflow apache-airflow/airflow -n airflow -f values-airflow.yaml

executor: KubernetesExecutor

# DAGs loaded manually via kubectl cp (repo is private)
dags:
  gitSync:
    enabled: false

# Web UI
webserver:
  defaultUser:
    enabled: true
    username: admin
    password: admin

# Environment variable to control the benchmark phase.
env:
  - name: BENCHMARK_PHASE
    value: "baseline"

# Minimal resources for the TB cluster
scheduler:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

triggerer:
  enabled: false

# No persistent logs
logs:
  persistence:
    enabled: false
